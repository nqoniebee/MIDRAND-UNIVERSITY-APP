<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Responsive screenshot frame | MIDRAND project</title><style>body{font:14px Arial,sans-serif;margin:0;padding:18px;background:#e6e9e4;color:#183b3b}header{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:16px}button,select{padding:10px;border:1px solid #a3b6a5;border-radius:4px;background:white;color:#183b3b}button{cursor:pointer}#frame-wrap{width:390px;max-width:none;margin:auto;border:1px solid #b9c5ba;box-shadow:0 8px 25px #183b3b22;background:white}iframe{width:100%;height:844px;border:0;display:block}h1{font-size:16px;margin:0}p{font-size:12px}</style><script defer src="js/responsive-preview.js"></script></head><body><header><h1>Responsive test frame</h1><label for="preview-page">Page</label> <select id="preview-page"><option value="index.html">Overview</option><option value="study.html">Study</option><option value="research.html#learning-lab">Learning lab</option><option value="people.html">People</option><option value="contact.html">Contact</option></select><button type="button" data-width="320">320 px</button><button type="button" data-width="390">390 px</button><button type="button" data-width="768">768 px</button><button type="button" data-width="1100">1100 px</button></header><main><p>A browser frame for checking responsive CSS. It does not emulate a physical phone or a different browser engine.</p><div id="frame-wrap"><iframe id="preview-frame" src="index.html" title="Department website at the selected viewport width"></iframe></div></main></body></html>
